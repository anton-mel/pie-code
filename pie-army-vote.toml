# pie for the agent army: Qwen3.8-27B, one process per question holding its whole team.
[server]
host = "127.0.0.1"
port = 8097

[model]
name = "default"
model = "mlx-community/Qwen3.8-27B-4bit"
host_kv_budget = "64MiB"    # RAM for one parked agent's recurrent state rows
disk_kv_budget = "32GiB"    # everything else parks on the SSD

[engine]
type = "metal"
device = ["metal:0"]
activation_dtype = "bfloat16"
kv_page_size = 32
total_pages = 2048           # 65k tokens: eight full-length voters live at once in one process
max_forward_tokens = 2048
max_forward_requests = 16   # lanes one batch may carry: a whole team decodes in one fire
max_model_len = 32768
max_state_slots = 40        # recurrent states: question, planner, team and verifiers

[runtime]
max_concurrent_processes = 64   # agents alive at once; only one fires at a time here
